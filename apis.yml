x-status-note: 'Flipagram was a mobile video-slideshow / social app acquired by ByteDance in 2017,
  rebranded to Vigo Video, and discontinued in 2019. There is no live developer portal, API
  documentation, or OpenAPI. Re-verified 2026-07-20: flipagram.com resolves to 103.136.221.86 (AWS
  nameservers, Outlook mail); port 443 accepts TCP but completes no TLS handshake, and HTTP/80 returns
  a 25-byte catch-all body ("the nlb has been offline") for every path — including /.well-known/*,
  /llms.txt and /openapi.json, so those 200s are not real documents. No GitHub organization exists and
  no first-party client library is published on npm, PyPI, RubyGems, NuGet, Packagist or crates.io. No
  enrichable public API surface.'
